<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00346e">
    <title>You're offline · OCC Election System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            color: #111827;
            padding: 16px;
        }
        .card {
            max-width: 380px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { margin: 0 0 20px; color: #4b5563; line-height: 1.5; font-size: 14px; }
        button {
            background: #00346e;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>
            Voting and live results need an internet connection.
            Please check your connection and try again.
        </p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
